<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Beriz Dautović — AI/ML Engineer">
  <defs>
    <radialGradient id="glowA" cx="12%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#b63a2d" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#b63a2d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="92%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#ece7dd" />
  <rect width="1200" height="630" fill="url(#glowA)" />
  <rect width="1200" height="630" fill="url(#glowB)" />

  <!-- paper frame -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#d2c7b8" stroke-width="1.5" />
  <!-- decorative rotated square -->
  <rect x="980" y="80" width="150" height="150" fill="none" stroke="#e5ddce" stroke-width="1.5" transform="rotate(22 1055 155)" />

  <!-- kicker -->
  <text x="110" y="270" font-family="'IBM Plex Mono', Consolas, monospace" font-size="26" letter-spacing="6" fill="#b63a2d">AI / ML ENGINEER</text>

  <!-- accent rule -->
  <rect x="110" y="290" width="56" height="4" fill="#b63a2d" />

  <!-- name -->
  <text x="106" y="400" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-size="118" font-weight="600" letter-spacing="-3" fill="#181614">Beriz Dautović</text>

  <!-- tagline -->
  <text x="110" y="470" font-family="'Space Grotesk', 'Segoe UI', Arial, sans-serif" font-size="30" fill="#5d554b">Selected work across AI, web, and game development.</text>

  <!-- footer wordmark -->
  <text x="110" y="545" font-family="'IBM Plex Mono', Consolas, monospace" font-size="22" letter-spacing="3" fill="#5d554b">dautovicb.github.io</text>
